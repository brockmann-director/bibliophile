<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4eee4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Bibliophile">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Bibliophile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400;1,9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4eee4;--card:#fffcf7;--soft:#ece3d4;--line:#e0d5c3;--ink:#2b2420;--muted:#7a6d60;--dim:#a99c8b;--accent:#8a2b34;--accent-2:#6f2029;--accent-soft:#f4e4e2;--gold:#b4832a;--green:#4b7a57;--red:#b24a3d;
  --serif:"Fraunces",Georgia,"Times New Roman",serif;--sans:Inter,system-ui,-apple-system,sans-serif;--shadow:0 1px 2px rgba(60,40,20,.06),0 6px 18px rgba(60,40,20,.07);--book:2px 3px 0 rgba(43,36,32,.08),0 8px 16px rgba(43,36,32,.16)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,textarea{font:inherit;color:inherit}
.wrap{max-width:720px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 18px calc(96px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}
.club{font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
h1{font-family:var(--serif);font-style:italic;font-weight:600;font-size:34px;letter-spacing:-.01em;margin:2px 0 0;line-height:1}
.cam{width:48px;height:48px;border-radius:50%;border:0;background:var(--accent);color:#fff8f0;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 14px rgba(138,43,52,.3);flex:none}
.cam svg{width:22px;height:22px}
.page-h{font-family:var(--serif);font-size:24px;font-weight:600;margin:0 0 2px;letter-spacing:-.01em}
.page-sub{color:var(--muted);font-size:14px;margin:0 0 18px}
.sec{font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:30px 0 12px}
.note{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--muted);font-size:13px;margin-bottom:14px}
.note b{color:var(--ink)}
.err{border-color:#e6c2bd;background:#fbefed;color:#7d3128}
.btn{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer;font-size:13px;font-weight:500;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;color:var(--ink);text-decoration:none}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff8f0}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted);padding-left:6px;padding-right:6px}
.btn.big{padding:12px 20px;font-size:15px}
.btn:disabled{opacity:.5;cursor:default}
.empty{color:var(--muted);text-align:center;padding:34px 16px;border:1.5px dashed var(--line);border-radius:16px;font-family:var(--serif);font-style:italic;font-size:16px}
.meta{font-size:13px;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.t-title{font-family:var(--serif);font-weight:600;letter-spacing:-.005em;line-height:1.2;cursor:pointer}
.t-auth{font-family:var(--serif);font-style:italic;color:var(--muted)}
.quote{font-family:var(--serif);font-style:italic;font-size:14px;color:var(--muted)}
/* Cover */
.cv{position:relative;width:60px;aspect-ratio:2/3;border-radius:3px 6px 6px 3px;overflow:hidden;box-shadow:var(--book);flex:none;background:var(--ph,#8a2b34);color:#fff8f0;display:flex;align-items:flex-end;padding:7px 6px;font-family:var(--serif);font-weight:600;font-size:10px;line-height:1.15}
.cv::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:rgba(0,0,0,.14)}
.cv span{position:relative;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.cv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cv.lg{width:104px;font-size:13px;padding:10px 9px}
.cv.sm{width:46px;font-size:8px;padding:5px}
/* Stapel */
.hero{display:grid;grid-template-columns:auto 1fr;gap:18px;background:var(--card);border-radius:18px;padding:18px;box-shadow:var(--shadow);margin-bottom:6px}
.hero .lbl{font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.hero .t-title{font-size:21px}
.hero .blurb{font-size:14px;color:var(--muted);margin-top:8px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.hero .row{margin-top:12px}
.book{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.book:last-child{border-bottom:0}
.book .t-title{font-size:17px}
.book .bi{min-width:0}
.book .quote{margin-top:4px}
.who{display:flex;align-items:center;gap:6px;margin-top:7px}
.av{width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;color:#fff;background:var(--c,#7a6d60);border:2px solid var(--card)}
.avs{display:flex}.avs .av+.av{margin-left:-6px}
.vote{display:flex;flex-direction:column;align-items:center;gap:1px;background:none;border:1.5px solid var(--line);border-radius:14px;padding:8px 10px;min-width:58px;cursor:pointer;color:var(--muted)}
.vote svg{width:18px;height:18px}
.vote b{font-family:var(--serif);font-size:18px;font-weight:600;color:var(--ink);line-height:1.1}
.vote small{font-size:10px;letter-spacing:.04em}
.vote.on{background:var(--accent);border-color:var(--accent);color:#fff8f0}
.vote.on b{color:#fff8f0}
.list{background:var(--card);border-radius:18px;padding:2px 16px;box-shadow:var(--shadow)}
/* Regal */
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:22px 16px}
.spine{display:flex;flex-direction:column;gap:8px;min-width:0}
.spine .cv{width:100%;font-size:12px;padding:9px 8px;cursor:pointer}
.spine .t-title{font-size:14px}
.stars{display:flex;gap:0}
.stars button{background:none;border:0;padding:1px;font-size:19px;line-height:1;cursor:pointer;color:var(--line)}
.stars button.on{color:var(--gold)}
.avg{font-size:12px;color:var(--muted)}
/* Treffen */
.cal{align-self:start;width:58px;border-radius:10px;overflow:hidden;background:var(--card);box-shadow:var(--shadow);text-align:center;flex:none}
.cal .m{background:var(--accent);color:#fff8f0;font-size:10px;font-weight:600;letter-spacing:.14em;padding:3px 0}
.cal .d{font-family:var(--serif);font-size:26px;font-weight:600;line-height:1.05;padding-top:4px}
.cal .w{font-size:10px;color:var(--muted);padding-bottom:5px;letter-spacing:.06em;text-transform:uppercase}
.date{display:grid;grid-template-columns:auto 1fr;gap:16px;padding:16px 0;border-bottom:1px solid var(--line)}
.date:last-child{border-bottom:0}
.date .hd{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.date .tm{font-family:var(--serif);font-size:19px;font-weight:600}
.tag{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.ans{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0 10px}
.an{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--muted)}
.an i{font-style:normal;width:16px;height:16px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;background:var(--dim)}
.an.yes i{background:var(--green)}.an.maybe i{background:var(--gold)}.an.no i{background:var(--red)}
.seg{display:inline-flex;background:var(--soft);border-radius:999px;padding:3px}
.seg button{background:none;border:0;border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;color:var(--muted);font-weight:500}
.seg button.on.yes{background:var(--green);color:#fff}
.seg button.on.maybe{background:var(--gold);color:#fff}
.seg button.on.no{background:var(--red);color:#fff}
.fixed{background:var(--accent);color:#fff8f0;border-radius:18px;padding:18px;margin-bottom:6px;box-shadow:0 8px 24px rgba(138,43,52,.25)}
.fixed .lbl{font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;opacity:.75}
.fixed .big{font-family:var(--serif);font-size:25px;font-weight:600;margin:6px 0 2px;line-height:1.2}
.fixed .meta{color:rgba(255,248,240,.8)}
.fixed .an{color:rgba(255,248,240,.85)}
.fixed .row{margin-top:14px}
.fixed .btn{background:rgba(255,255,255,.14);border-color:transparent;color:#fff8f0}
.fixed .btn.pri{background:#fff8f0;color:var(--accent)}
form.box{background:var(--card);border-radius:18px;padding:16px;display:grid;gap:10px;box-shadow:var(--shadow)}
input[type=text],input[type=search],input[type=datetime-local],textarea{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 13px;width:100%;min-width:0;font-size:16px}
input:focus,textarea:focus{outline:2px solid rgba(138,43,52,.25);border-color:var(--accent)}
input[type=datetime-local]{min-height:46px}
textarea{min-height:120px;resize:vertical;line-height:1.5}
label.f{display:block;font-size:11px;color:var(--muted);margin:14px 0 6px;text-transform:uppercase;letter-spacing:.14em;font-weight:600}
/* Tab-Leiste */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(251,247,240,.92);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 0 calc(6px + env(safe-area-inset-bottom))}
.tabs div{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;cursor:pointer;color:var(--dim);font-size:11px;font-weight:600;letter-spacing:.02em}
.tabs svg{width:24px;height:24px}
.tabs button.on{color:var(--accent)}
/* Sheet */
.ov{position:fixed;inset:0;background:rgba(43,36,32,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50}
@media (min-width:600px){.ov{align-items:center;padding:16px}}
.sheet{background:var(--bg);border-radius:22px 22px 0 0;max-width:560px;width:100%;padding:20px 18px calc(22px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto;-webkit-overflow-scrolling:touch}
@media (min-width:600px){.sheet{border-radius:22px}}
.sheet h3{font-family:var(--serif);margin:0 0 4px;font-size:22px;font-weight:600;line-height:1.2}
.sheet p{margin:14px 0;white-space:pre-line}
.sheet .x{float:right;background:var(--soft);border:0;color:var(--muted);width:30px;height:30px;border-radius:50%;font-size:18px;cursor:pointer;line-height:1}
.sheet .head{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start}
.sheet .row{margin-top:16px}
.drop{display:flex;flex-direction:column;align-items:center;gap:8px;border:1.5px dashed var(--accent);background:var(--accent-soft);border-radius:18px;padding:26px 18px;cursor:pointer;color:var(--accent);text-align:center;font-weight:600;margin-top:14px}
.drop svg{width:30px;height:30px}
.drop small{color:var(--muted);font-weight:400;max-width:300px}
.drop input{display:none}
.photo{display:flex;gap:14px;align-items:center;margin:14px 0 6px}
.photo img{width:70px;aspect-ratio:3/4;object-fit:cover;border-radius:8px;box-shadow:var(--shadow)}
.hits{display:grid;gap:8px;margin-top:12px}
.hit{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;cursor:pointer}
.hit .t-title{font-size:15px;display:block}
.hit .src{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-top:3px}
.busy{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px;margin:14px 0}
.spin{width:18px;height:18px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.covers{display:flex;gap:12px}
.covers button{background:none;border:2px solid transparent;border-radius:9px;padding:3px;cursor:pointer}
.covers button.on{border-color:var(--accent)}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:0;font-size:13px}
@media (max-width:420px){h1{font-size:30px}.hero{grid-template-columns:auto 1fr;gap:14px;padding:14px}.cv.lg{width:88px}.book{gap:12px}.cv{width:54px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><div class="club">Die Leseratten</div><h1>Bibliophile</h1></div>
    <button class="cam" id="addBtn" hidden aria-label="Buch hinzufügen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5A2.5 2.5 0 0 1 5.5 6h1.6l1.4-2h7l1.4 2h1.6A2.5 2.5 0 0 1 21 8.5v9a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5z"/><circle cx="12" cy="12.5" r="3.6"/></svg></button>
  </header>
  <main id="main"></main>
  <div id="modal"></div>
</div>
<nav class="tabs" id="nav" hidden><div>
  <button data-v="stapel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="15" width="18" height="5" rx="1"/><rect x="5" y="9.5" width="15" height="5.5" rx="1"/><rect x="4" y="4" width="14" height="5.5" rx="1"/></svg>Stapel</button>
  <button data-v="regal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M3 21h18"/><rect x="4" y="5" width="3.5" height="16"/><rect x="8.5" y="3" width="3.5" height="18"/><path d="M14 7.5l3.3-1 3.7 13.5-3.3 1z"/></svg>Regal</button>
  <button data-v="treffen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/><path d="M8.5 14.5l2.2 2.2 4.6-4.6"/></svg>Treffen</button>
</div></nav>
<script>
// Supabase-Projekt (dasselbe wie Kinozettel). Der Publishable Key ist öffentlich, Zugriff nur über die bib_*-Funktionen.
const SB_URL = 'https://xvhuljefiqvprabpapcb.supabase.co';
const SB_KEY = 'sb_publishable_E7jP8kgVCX3kTVs9KICmcA_M9TXuCkh';
const TESS = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
// Optional: eigener Google-Books-API-Key, falls die Suche ohne Key oft "Quota exceeded" meldet.
const GB_KEY = '';

const S = { token:null, demo:false, d:null, view:'stapel', err:'', loading:true, sheet:null, add:null, edit:false, noAI:false };
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const WD=['So','Mo','Di','Mi','Do','Fr','Sa'], WDL=['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'], MO=['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
const pad = n => String(n).padStart(2,'0');
const hm = d => pad(d.getHours())+':'+pad(d.getMinutes());
const dDay = iso => { const d=new Date(iso); return d.getDate()+'. '+MO[d.getMonth()]; };
const norm = t => String(t||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
// ---------- Backend ----------
async function rpc(fn, args){
  if(S.demo) return Demo.call(fn, args);
  const r = await fetch(SB_URL + '/rest/v1/rpc/' + fn, { method:'POST', headers:{ apikey:SB_KEY, 'Content-Type':'application/json' }, body: JSON.stringify(args) });
  if(!r.ok){ let m=''; try{ m=(await r.json()).message||''; }catch(_){} throw new Error(m || ('HTTP '+r.status)); }
  const t = await r.text(); return t ? JSON.parse(t) : null;
}
async function reload(){ S.d = await rpc('bib_me', {p_token:S.token}); }
async function act(fn, args, keepSheet){
  try { await rpc(fn, Object.assign({p_token:S.token}, args)); await reload(); S.err=''; if(!keepSheet){ S.sheet=null; S.add=null; S.edit=false; } }
  catch(e){ S.err = e.message; if(!keepSheet) { S.sheet=null; S.add=null; } }
  render();
}

// Demo-Modus (?demo): alles bleibt nur in diesem Browser, zum Ausprobieren ohne Datenbank.
const Demo = (() => {
  const KEY = 'bib_demo_v1';
  const uid = () => Math.random().toString(36).slice(2,10)+Date.now().toString(36);
  const inDays = (n, h, m) => { const d=new Date(); d.setDate(d.getDate()+n); d.setHours(h,m,0,0); return d.toISOString(); };
  function seed(){
    const M = [{id:'m1',name:'Jan'},{id:'m2',name:'Anna'},{id:'m3',name:'Marie'}];
    const now = Date.now(), ago = n => new Date(now - n*864e5).toISOString();
    return { members:M,
      books:[
        {id:'b1',title:'Die Wand',authors:'Marlen Haushofer',blurb:'Eine Frau verbringt ein Wochenende in einer Jagdhütte in den Bergen. Am Morgen ist sie allein, getrennt von der Welt durch eine unsichtbare Wand, hinter der alles Leben erstarrt ist.',cover:'',isbn:'',note:'Lag bei Felix Jud im Fenster',status:'reading',added_by:'m2',created_at:ago(20),read_at:null,votes:['m1','m2','m3'],ratings:{}},
        {id:'b2',title:'Stoner',authors:'John Williams',blurb:'Das unscheinbare Leben eines Literaturprofessors im Mittleren Westen, erzählt mit großer Wärme.',cover:'',isbn:'',note:'',status:'list',added_by:'m1',created_at:ago(6),read_at:null,votes:['m1','m3'],ratings:{}},
        {id:'b3',title:'Hund, Wolf, Schakal',authors:'Behzad Karim Khani',blurb:'',cover:'',isbn:'',note:'Buchhandlung Eppendorf',status:'list',added_by:'m3',created_at:ago(2),read_at:null,votes:['m3'],ratings:{}},
        {id:'b4',title:'Der Mann, der zu viel wusste',authors:'',blurb:'',cover:'',isbn:'',note:'',status:'read',added_by:'m1',created_at:ago(60),read_at:ago(30),votes:[],ratings:{m2:4,m3:5}}
      ],
      dates:[
        {id:'d1',starts_at:inDays(7,19,30),place:'bei Anna',note:'',fixed:false,created_by:'m2',answers:{m2:'yes',m3:'maybe'}},
        {id:'d2',starts_at:inDays(9,19,0),place:'bei Anna',note:'',fixed:false,created_by:'m2',answers:{m2:'yes',m3:'yes'}}
      ] };
  }
  let db; try{ db = JSON.parse(localStorage.getItem(KEY)); }catch(_){}
  if(!db) db = seed();
  const save = () => { try{ localStorage.setItem(KEY, JSON.stringify(db)); }catch(_){} };
  const me = 'm1', book = id => db.books.find(b => b.id === id), date = id => db.dates.find(d => d.id === id);
  const F = {
    bib_me: () => ({ me:db.members[0], members:db.members, books:db.books.filter(b=>b.status!=='removed').slice().sort((a,b)=>b.created_at.localeCompare(a.created_at)),
      dates:db.dates.filter(d => new Date(d.starts_at) > Date.now()-12*36e5).slice().sort((a,b)=>a.starts_at.localeCompare(b.starts_at)) }),
    bib_add_book: a => {
      if(db.books.some(b => b.status!=='removed' && ((a.p_isbn && b.isbn===a.p_isbn) || norm(b.title)===norm(a.p_title)))) throw new Error('Das Buch steht schon in der Liste');
      if(String(a.p_cover||'').length > 400000) throw new Error('Foto ist zu groß');
      db.books.push({id:uid(),title:a.p_title.trim(),authors:a.p_authors||'',blurb:a.p_blurb||'',cover:a.p_cover||'',isbn:a.p_isbn||'',note:a.p_note||'',status:'list',added_by:me,created_at:new Date().toISOString(),read_at:null,votes:[me],ratings:{}});
    },
    bib_update_book: a => { const b = book(a.p_book); if(a.p_blurb!=null) b.blurb=a.p_blurb; if(a.p_note!=null) b.note=a.p_note; },
    bib_set_status: a => { if(a.p_status==='reading') db.books.forEach(b => { if(b.status==='reading') b.status='list'; }); const b = book(a.p_book); b.status=a.p_status; if(a.p_status==='read') b.read_at=b.read_at||new Date().toISOString(); if(a.p_status==='list') b.read_at=null; },
    bib_vote: a => { const b = book(a.p_book); b.votes = b.votes.filter(x => x!==me); if(a.p_on) b.votes.push(me); },
    bib_rate: a => { const b = book(a.p_book); if(a.p_stars) b.ratings[me]=a.p_stars; else delete b.ratings[me]; },
    bib_add_date: a => { db.dates.push({id:uid(),starts_at:new Date(a.p_at).toISOString(),place:a.p_place||'',note:a.p_note||'',fixed:false,created_by:me,answers:{[me]:'yes'}}); },
    bib_answer: a => { const d = date(a.p_date); if(a.p_answer) d.answers[me]=a.p_answer; else delete d.answers[me]; },
    bib_fix_date: a => { if(a.p_on) db.dates.forEach(d => d.fixed=false); date(a.p_date).fixed=!!a.p_on; },
    bib_delete_date: a => { db.dates = db.dates.filter(d => d.id!==a.p_date); }
  };
  return { call: async (fn, a) => { const r = F[fn](a); save(); return JSON.parse(JSON.stringify(r ?? null)); }, reset: () => { db = seed(); save(); } };
})();

const books = () => (S.d && S.d.books) || [];

const reading = () => books().find(b => b.status === 'reading');

const dates = () => (S.d && S.d.dates) || [];
const fixedDate = () => dates().find(d => d.fixed);
const avgStars = b => { const v = Object.values(b.ratings||{}); return v.length ? v.reduce((a,c)=>a+c,0)/v.length : 0; };

const PH = ['#8a2b34','#2f5d50','#3b4a6b','#a0662a','#5b4a6e','#6b5a3a'];
const AVC = ['#8a2b34','#2f5d50','#a0662a','#3b4a6b','#5b4a6e'];

const av = id => { const i = Math.max(0, members().findIndex(m => m.id === id)), n = nameOf(id); return `<span class="av" style="--c:${AVC[i % AVC.length]}" title="${esc(n)}">${esc(initials(n))}</span>`; };

function score(d){ return Object.values(d.answers||{}).reduce((a,v) => a + (v==='yes'?2:v==='maybe'?1:0), 0); }

function whenLong(iso){ const d = new Date(iso); return WDL[d.getDay()] + ', ' + d.getDate() + '. ' + MO[d.getMonth()] + ' · ' + hm(d) + ' Uhr'; }
function calTile(iso){ const d = new Date(iso); return `<div class="cal"><div class="m">${MO[d.getMonth()].toUpperCase()}</div><div class="d">${d.getDate()}</div><div class="w">${WD[d.getDay()]}</div></div>`; }
function ics(d){
  const z = t => new Date(t).toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
  const r = reading(), x = s => String(s||'').replace(/([,;\\])/g,'\\$1').replace(/\n/g,'\\n');
  const lines = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Bibliophile//DE','BEGIN:VEVENT','UID:'+d.id+'@bibliophile','DTSTAMP:'+z(Date.now()),'DTSTART:'+z(d.starts_at),'DTEND:'+z(new Date(d.starts_at).getTime()+2*36e5),
    'SUMMARY:Leseratten Buchclub','LOCATION:'+x(d.place),'DESCRIPTION:'+x(r?'Buch: '+r.title+(r.authors?' von '+r.authors:''):''),'END:VEVENT','END:VCALENDAR'];
  return 'data:text/calendar;charset=utf-8,' + encodeURIComponent(lines.join('\r\n'));
}

function loadImage(file){
  return new Promise((ok, bad) => { const u = URL.createObjectURL(file), i = new Image(); i.onload = () => ok(i); i.onerror = () => bad(new Error('Das Foto ließ sich nicht öffnen')); i.src = u; });
}
function toCanvas(img, max, gray){
  const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
  const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth*s); c.height = Math.round(img.naturalHeight*s);
  const g = c.getContext('2d'); if(gray) g.filter = 'grayscale(1) contrast(1.3)'; g.drawImage(img, 0, 0, c.width, c.height); return c;
}
const noAiError = () => Object.assign(new Error('noai'), { noai:true });
async function aiScan(img){
  const data = toCanvas(img, 1400).toDataURL('image/jpeg', 0.85).split(',')[1];
  let r;
  try { r = await fetch(SB_URL + '/functions/v1/bib-scan', { method:'POST', headers:{ apikey:SB_KEY, 'Content-Type':'application/json' }, body: JSON.stringify({ token:S.token, image:data, mediaType:'image/jpeg' }) }); }
  catch(_){ throw noAiError(); } // Funktion nicht erreichbar (z. B. noch nicht eingerichtet)
  if(r.status === 404){ S.noAI = true; throw noAiError(); }
  let j = {}; try { j = await r.json(); } catch(_){}
  if(r.status === 401 && !j.error) throw new Error('Die KI-Funktion lehnt die Anfrage ab. In Supabase bei „bib-scan“ die JWT-Prüfung ausschalten');
  if(!r.ok) throw new Error(j.error || ('Erkennung fehlgeschlagen (' + r.status + ')'));
  return Array.isArray(j.books) ? j.books : [];
}
async function onPhoto(file){
  const A = S.add; A.results = null; A.msg = ''; A.busy = 'Foto wird vorbereitet …'; render();
  let img;
  try { img = await loadImage(file); A.photo = toCanvas(img, 360).toDataURL('image/jpeg', 0.72); }
  catch(e){ A.busy = ''; A.msg = e.message + '. Tipp den Titel einfach unten ein.'; render(); return; }
  if(!S.demo && !S.noAI){
    A.busy = 'Ich schaue mir das Foto an …'; render();
    try {
      const found = await aiScan(img);
      A.busy = '';
      if(!found.length){ A.msg = 'Auf dem Foto habe ich kein Buch erkannt. Tipp den Titel unten ein.'; render(); return; }
      A.results = found.filter(b => b.title).map(b => ({ title:b.title, authors:b.authors||'', isbn:String(b.isbn||'').replace(/[^0-9X]/gi,''), blurb:b.blurb||'', cover:'', year:'', ai:true }));
      A.query = '';
      render(); enrichCovers(A); return;
    } catch(e){
      if(!e.noai){ A.busy = ''; A.msg = e.message + '. Du kannst den Titel unten eintippen.'; render(); return; }
    }
  }
  await ocrPhoto(img);
}

const COVER_WORDS = new Set(['roman','romane','erzahlung','erzahlungen','novelle','thriller','krimi','kriminalroman','bestseller','spiegel','spiegelbestseller','der','die','das','nr','band','taschenbuch','neu','novel','the','a','sunday','times','new','york','international','autorin','autor','vom','von','des','buch','jahres','preis','ausgezeichnet','mit','dem','sachbuch','gedichte']);
const cleanLine = s => String(s||'').replace(/[^0-9A-Za-zÀ-ÖØ-öø-ÿß'’ ]+/g,' ').split(/\s+/).filter(w => w.length >= 2 && /[A-Za-zÀ-ÿß]{2}/.test(w)).join(' ');
const usefulLine = t => t.split(' ').some(w => w.length >= 3 && !COVER_WORDS.has(norm(w)));
function queryFromOcr(data){
  const flat = String(data.text||'').replace(/[\s\-–]/g,'');
  const isbn = (flat.match(/97[89]\d{10}/) || [])[0];
  if(isbn) return 'isbn:' + isbn;
  const lines = (data.lines||[]).map(l => ({ t:cleanLine(l.text), h:(l.bbox.y1-l.bbox.y0), c:l.confidence })).filter(l => l.t.length >= 3 && l.c >= 50 && usefulLine(l.t));
  lines.sort((a,b) => b.h - a.h);
  return lines.slice(0,3).map(l => l.t).join(' ').split(' ').slice(0,8).join(' ');
}
async function ocrPhoto(img){
  const A = S.add;
  try {
    A.busy = 'Lese das Cover …'; render();
    const T = await loadTesseract();
    const res = await T.recognize(toCanvas(img, 1600, true), 'deu', { logger: m => { if(m.status === 'recognizing text'){ const b = $('.busy span'); if(b) b.textContent = 'Lese das Cover … ' + Math.round(m.progress*100) + ' %'; } } });
    const q = queryFromOcr(res.data);
    if(!q){ A.busy = ''; A.msg = 'Auf dem Foto konnte ich keinen Titel lesen. Tipp ein, zwei Wörter vom Cover ein.'; render(); return; }
    A.query = q; await doSearch();
  } catch(e){ A.busy = ''; A.msg = e.message + '. Tipp den Titel einfach ein.'; render(); }
}

// ---------- Buchsuche: Google Books und Open Library parallel ----------
const stripHtml = s => { const d = document.createElement('div'); d.innerHTML = String(s||'').replace(/<br\s*\/?>|<\/p>/gi,'\n'); return (d.textContent||'').replace(/\n{3,}/g,'\n\n').trim(); };
function shortBlurb(s){
  s = stripHtml(s); if(s.length <= 700) return s;
  const cut = s.slice(0, 700), i = Math.max(cut.lastIndexOf('. '), cut.lastIndexOf('! '), cut.lastIndexOf('? '));
  return (i > 300 ? cut.slice(0, i+1) : cut.trim() + ' …');
}
async function googleBooks(q){
  const r = await fetch('https://www.googleapis.com/books/v1/volumes?q=' + encodeURIComponent(q) + '&maxResults=12&printType=books' + (GB_KEY ? '&key=' + GB_KEY : ''));
  if(!r.ok) throw new Error('Google ' + r.status);
  const j = await r.json();
  if(j.error) throw new Error('Google ' + (j.error.code || 'Fehler'));
  const out = (j.items||[]).map(it => { const v = it.volumeInfo || {}, ids = v.industryIdentifiers || [];
    const isbn = ((ids.find(x => x.type==='ISBN_13') || ids.find(x => x.type==='ISBN_10') || {}).identifier) || '';
    const img = v.imageLinks && (v.imageLinks.thumbnail || v.imageLinks.smallThumbnail);
    return { gid:it.id, title:v.title || '', authors:(v.authors||[]).join(', '), year:String(v.publishedDate||'').slice(0,4), blurb:v.description || '', lang:v.language || '',
      cover: img ? img.replace(/^http:/,'https:').replace('&edge=curl','') : '', isbn };
  }).filter(x => x.title);
  return out.map((x,i) => [x,i]).sort((a,b) => ((b[0].lang==='de')-(a[0].lang==='de')) || ((!!b[0].cover)-(!!a[0].cover)) || (a[1]-b[1])).map(p => p[0]);
}
async function openLibrary(q){
  const plain = q.replace(/\b(intitle|inauthor|isbn):/g,' ').replace(/\s+/g,' ').trim();
  const r = await fetch('https://openlibrary.org/search.json?limit=10&fields=key,title,author_name,first_publish_year,cover_i,isbn,language&q=' + encodeURIComponent(plain));
  if(!r.ok) throw new Error('Open Library ' + r.status);
  const j = await r.json();
  return (j.docs||[]).map(d => ({ olKey:d.key||'', title:d.title||'', authors:(d.author_name||[]).slice(0,2).join(', '), year:String(d.first_publish_year||''), blurb:'',
    cover:d.cover_i ? `https://covers.openlibrary.org/b/id/${d.cover_i}-M.jpg` : '', isbn:(d.isbn||[]).find(x => x.length===13) || '', lang:(d.language||[]).includes('ger') ? 'de' : '' })).filter(x => x.title);
}
async function searchBooks(q){
  const [g, o] = await Promise.allSettled([googleBooks(q), openLibrary(q)]);
  if(g.status === 'rejected' && o.status === 'rejected') throw new Error('Die Buchsuche ist gerade nicht erreichbar');
  const out = [], seen = new Set();
  for(const x of [...(g.value||[]), ...(o.value||[])]){
    const k = norm(x.title) + '|' + norm(x.authors.split(',')[0]);
    const prev = out.find(y => norm(y.title) + '|' + norm(y.authors.split(',')[0]) === k);
    if(prev){ if(!prev.cover && x.cover) prev.cover = x.cover; if(!prev.isbn && x.isbn) prev.isbn = x.isbn; if(!prev.olKey && x.olKey) prev.olKey = x.olKey; continue; }
    if(seen.size >= 8) continue; seen.add(k); out.push(x);
  }
  return out;
}
async function enrichOne(r){
  if(r.cover) return;
  const first = r.authors.split(',')[0].trim();
  try {
    const hits = await searchBooks(r.isbn ? 'isbn:' + r.isbn : r.title + (first ? ' ' + first : ''));
    const same = hits.filter(x => norm(x.title).includes(norm(r.title)) || norm(r.title).includes(norm(x.title)));
    const h = same.find(x => x.cover) || (r.isbn ? hits.find(x => x.cover) : null);
    if(h){ r.cover = h.cover; if(!r.isbn) r.isbn = h.isbn; if(!r.blurb && h.blurb) r.blurb = h.blurb; if(!r.gid) r.gid = h.gid; if(!r.olKey) r.olKey = h.olKey; }
  } catch(_){}
  if(!r.cover && r.isbn) r.cover = `https://covers.openlibrary.org/b/isbn/${r.isbn}-M.jpg?default=false`;
}
async function enrichCovers(A){
  await Promise.all((A.results||[]).map(enrichOne));
  if(S.add === A && !A.draft) render();
}
async function doSearch(){
  const A = S.add; if(!A.query.trim()){ A.busy=''; render(); return; }
  A.busy = 'Suche „' + A.query.replace(/^isbn:/,'ISBN ') + '“ …'; A.msg = ''; render();
  try { A.results = await searchBooks(A.query); }
  catch(e){ A.results = null; A.msg = e.message + '. Trag das Buch selbst ein.'; }
  A.busy = ''; render();
}
async function pick(r){
  const A = S.add;
  A.draft = { title:r.title, authors:r.authors, blurb:shortBlurb(r.blurb), note:'', isbn:r.isbn||'', gCover:r.cover||'', useCover: r.cover ? 'g' : 'p' };
  if(A.draft.blurb && A.draft.gCover){ render(); return; }
  A.busy = 'Suche Cover und Klappentext …'; render();
  if(!r.cover || (!r.gid && !r.olKey)) { await enrichOne(r); }
  if(S.add !== A || !A.draft) return;
  readDraft();
  if(!A.draft.gCover && r.cover){ A.draft.gCover = r.cover; A.draft.useCover = 'g'; }
  if(!A.draft.isbn && r.isbn) A.draft.isbn = r.isbn;
  if(!A.draft.blurb.trim()){
    let t = shortBlurb(r.blurb);
    const twin = !t && (A.results||[]).find(x => x !== r && x.blurb && norm(x.title) === norm(r.title));
    if(twin) t = shortBlurb(twin.blurb);
    try {
      if(!t && r.gid){ const j = await (await fetch('https://www.googleapis.com/books/v1/volumes/' + r.gid + (GB_KEY ? '?key=' + GB_KEY : ''))).json(); t = shortBlurb((j.volumeInfo||{}).description); }
      if(!t && r.olKey){ const j = await (await fetch('https://openlibrary.org' + r.olKey + '.json')).json(); const d = j.description; t = shortBlurb(typeof d === 'string' ? d : (d && d.value) || ''); }
    } catch(_){}
    if(S.add !== A || !A.draft) return;
    readDraft(); if(t && !A.draft.blurb.trim()) A.draft.blurb = t;
  }
  A.busy = ''; render();
}
function readDraft(){ const D = S.add && S.add.draft; if(!D || !$('#dT')) return; D.title = $('#dT').value; D.authors = $('#dA').value; D.blurb = $('#dB').value; D.note = $('#dN').value; }

// ---------- Events ----------
function closeSheet(){ S.sheet = null; S.add = null; S.edit = false; render(); }
function bind(){
  $$('[data-open]').forEach(el => el.onclick = () => { S.sheet = el.dataset.open; S.edit = false; render(); });
  $$('[data-close]').forEach(el => el.onclick = closeSheet);
  const ov = $('#ov'); if(ov) ov.onclick = e => { if(e.target === ov && !(S.add && S.add.draft)) closeSheet(); };
  $$('[data-vote]').forEach(b => b.onclick = () => { const [id, on] = b.dataset.vote.split('|'); b.disabled = true; act('bib_vote', {p_book:id, p_on:on==='1'}, true); });
  $$('[data-st]').forEach(b => b.onclick = () => { const [id, st] = b.dataset.st.split('|'); b.disabled = true; if(st==='read') S.view = 'regal'; if(st==='reading' || st==='list') S.view = 'stapel'; act('bib_set_status', {p_book:id, p_status:st}); });
  $$('[data-remove]').forEach(b => b.onclick = () => { if(confirm('Buch entfernen?')) act('bib_set_status', {p_book:b.dataset.remove, p_status:'removed'}); });
  $$('[data-rate]').forEach(b => b.onclick = () => { const [id, n] = b.dataset.rate.split('|'); act('bib_rate', {p_book:id, p_stars:+n}, true); });
  $$('[data-ans]').forEach(b => b.onclick = () => { const [id, a] = b.dataset.ans.split('|'); b.disabled = true; act('bib_answer', {p_date:id, p_answer:a}, true); });
  $$('[data-fix]').forEach(b => b.onclick = () => { const [id, on] = b.dataset.fix.split('|'); b.disabled = true; act('bib_fix_date', {p_date:id, p_on:on==='1'}, true); });
  $$('[data-del]').forEach(b => b.onclick = () => { if(confirm('Terminvorschlag löschen?')) act('bib_delete_date', {p_date:b.dataset.del}, true); });
  const df = $('#dateForm'); if(df) df.onsubmit = e => { e.preventDefault(); const v = $('#dAt').value; if(!v) return; const at = new Date(v);
    if(isNaN(at)) return; df.querySelector('button').disabled = true; act('bib_add_date', {p_at:at.toISOString(), p_place:$('#dPlace').value.trim(), p_note:''}, true); };
  // Buch-Details bearbeiten
  const eo = $('#eOpen'); if(eo) eo.onclick = () => { S.edit = true; render(); };
  const ec = $('#eCancel'); if(ec) ec.onclick = () => { S.edit = false; render(); };
  const es = $('#eSave'); if(es) es.onclick = () => { es.disabled = true; S.edit = false; act('bib_update_book', {p_book:S.sheet, p_blurb:$('#eBlurb').value.trim(), p_note:$('#eNote').value.trim()}, true); };
  // Erfassen
  const af = $('#aFile'); if(af) af.onchange = () => { const f = af.files && af.files[0]; if(f) onPhoto(f); };
  const as = $('#aSearch'); if(as) as.onsubmit = e => { e.preventDefault(); S.add.query = $('#aQ').value.trim(); doSearch(); };
  const aq = $('#aQ'); if(aq) aq.oninput = () => { S.add.query = aq.value; };
  $$('[data-pick]').forEach(b => b.onclick = () => pick(S.add.results[+b.dataset.pick]));
  const am = $('#aManual'); if(am) am.onclick = () => { const q = S.add.query && !/^isbn:/.test(S.add.query) ? S.add.query : ''; S.add.draft = { title:q, authors:'', blurb:'', note:'', isbn:'', gCover:'', useCover:'p' }; render(); };
  $$('[data-cv]').forEach(b => b.onclick = () => { readDraft(); S.add.draft.useCover = b.dataset.cv; render(); });
  const db = $('#dBack'); if(db) db.onclick = () => { readDraft(); S.add.draft = null; S.add.busy = ''; render(); };
  const ds = $('#dSave'); if(ds) ds.onclick = () => {
    readDraft(); const D = S.add.draft; if(!D.title.trim()){ $('#dT').focus(); return; }
    const cv = D.useCover === 'g' && D.gCover ? D.gCover : (S.add.photo || D.gCover || '');
    ds.disabled = true; S.view = 'stapel';
    act('bib_add_book', {p_title:D.title.trim(), p_authors:D.authors.trim(), p_blurb:D.blurb.trim(), p_cover:cv, p_isbn:D.isbn||'', p_note:D.note.trim()});
  };
}
$('#addBtn').onclick = () => { S.sheet = 'add'; S.add = { photo:null, query:'', results:null, busy:'', msg:'', draft:null }; render(); };
$('#nav').onclick = e => { const b = e.target.closest('button'); if(!b) return; S.view = b.dataset.v; try{ localStorage.setItem('bib_view', S.view); }catch(_){} window.scrollTo(0,0); render(); };
document.addEventListener('keydown', e => { if(e.key === 'Escape' && S.sheet && !(S.add && S.add.draft)) closeSheet(); });
// Beim Zurückkehren in die App frische Daten holen (außer während ein Fenster offen ist).
document.addEventListener('visibilitychange', async () => { if(document.visibilityState === 'visible' && S.d && !S.sheet){ try{ await reload(); render(); }catch(_){} } });

(async () => {
  const qs = new URLSearchParams(location.search);
  S.demo = qs.has('demo');
  if(S.demo){ S.token = 'demo'; if(qs.get('demo') === 'reset') Demo.reset(); }
  else {
    S.token = qs.get('k') || (() => { try{ return localStorage.getItem('bib_token'); }catch(_){ return null; } })();
    if(qs.get('k')){ try{ localStorage.setItem('bib_token', qs.get('k')); }catch(_){} }
  }
  try{ const v = localStorage.getItem('bib_view'); if(['stapel','regal','treffen'].includes(v)) S.view = v; }catch(_){}
  render();
  if(S.token){ try{ await reload(); } catch(e){ S.err = /Ungültiger Link/.test(e.message) ? '' : 'Verbindung zur Datenbank fehlgeschlagen: ' + e.message; S.d = null; } }
  S.loading = false;
  render();
})();
</script>
